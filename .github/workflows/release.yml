name: Release

on:
  push:
    branches: ["develop"]
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # ──────────────────────────────────────────
  # macOS arm64 (Apple Silicon) — with signing
  # ──────────────────────────────────────────
  build-macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust target (aarch64)
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve app version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            APP_VERSION="${RELEASE_TAG#v}"
            ARTIFACT_VERSION="$APP_VERSION"
          else
            APP_VERSION="$(node -p "require('./package.json').version")"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            ARTIFACT_VERSION="${APP_VERSION}-dev.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          fi

          echo "Building app version: $APP_VERSION"
          echo "Artifact version: $ARTIFACT_VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$APP_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          echo "APP_VERSION=$ARTIFACT_VERSION" >> $GITHUB_ENV
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "artifact_version=$ARTIFACT_VERSION" >> $GITHUB_OUTPUT

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package signed macOS app (arm64)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET_TRIPLE: aarch64-apple-darwin
          DMG_ARCH_SUFFIX: apple-silicon
        run: bash scripts/package-macos-release.sh

      - name: Upload arm64 DMG to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Lysmata_${{ steps.version.outputs.artifact_version }}_apple-silicon.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Upload arm64 DMG artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Lysmata-${{ steps.version.outputs.artifact_version }}-apple-silicon
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Lysmata_${{ steps.version.outputs.artifact_version }}_apple-silicon.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────
  # macOS x86_64 (Intel) — with signing
  # ──────────────────────────────────────────
  build-macos-x64:
    name: macOS (Intel)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust target (x86_64)
        run: rustup target add x86_64-apple-darwin

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve app version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            APP_VERSION="${RELEASE_TAG#v}"
            ARTIFACT_VERSION="$APP_VERSION"
          else
            APP_VERSION="$(node -p "require('./package.json').version")"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            ARTIFACT_VERSION="${APP_VERSION}-dev.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          fi

          echo "Building app version: $APP_VERSION"
          echo "Artifact version: $ARTIFACT_VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$APP_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          echo "APP_VERSION=$ARTIFACT_VERSION" >> $GITHUB_ENV
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "artifact_version=$ARTIFACT_VERSION" >> $GITHUB_OUTPUT

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package signed macOS app (x64)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET_TRIPLE: x86_64-apple-darwin
          DMG_ARCH_SUFFIX: intel
        run: bash scripts/package-macos-release.sh

      - name: Upload x64 DMG to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Lysmata_${{ steps.version.outputs.artifact_version }}_intel.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Upload x64 DMG artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Lysmata-${{ steps.version.outputs.artifact_version }}-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/Lysmata_${{ steps.version.outputs.artifact_version }}_intel.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────
  # Windows x64 — no signing
  # ──────────────────────────────────────────
  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Resolve app version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            APP_VERSION="${RELEASE_TAG#v}"
            ARTIFACT_VERSION="$APP_VERSION"
          else
            APP_VERSION="$(node -p "require('./package.json').version")"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            ARTIFACT_VERSION="${APP_VERSION}-dev.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          fi

          echo "Building app version: $APP_VERSION"
          echo "Artifact version: $ARTIFACT_VERSION"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$APP_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "
          echo "APP_VERSION=$ARTIFACT_VERSION" >> $GITHUB_ENV
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "artifact_version=$ARTIFACT_VERSION" >> $GITHUB_OUTPUT

      - name: Build sidecar (Windows x64)
        run: bun run build:sidecar
        env:
          SIDECAR_TARGET: x86_64-pc-windows-msvc

      - name: Build Tauri app (Windows NSIS installer)
        run: bun run tauri build --bundles nsis

      - name: Rename Windows installer for artifact
        if: github.event_name == 'push'
        shell: bash
        run: |
          SRC="src-tauri/target/release/bundle/nsis/Lysmata_${{ steps.version.outputs.app_version }}_x64-setup.exe"
          DST="src-tauri/target/release/bundle/nsis/Lysmata_${{ steps.version.outputs.artifact_version }}_x64-setup.exe"
          mv "$SRC" "$DST"

      - name: Upload Windows installer to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/nsis/Lysmata_${{ steps.version.outputs.artifact_version }}_x64-setup.exe
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Upload Windows installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Lysmata-${{ steps.version.outputs.artifact_version }}-windows-x64
          path: src-tauri/target/release/bundle/nsis/Lysmata_${{ steps.version.outputs.artifact_version }}_x64-setup.exe
          if-no-files-found: error
